services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailgate-mailserver
    hostname: ${MAILGATE_HOSTNAME:-mailgate.local}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Brussels}
      OVERRIDE_HOSTNAME: ${MAILGATE_HOSTNAME:-mailgate.local}
      SMTP_ONLY: "1"
      ENABLE_FETCHMAIL: "1"
      FETCHMAIL_POLL: ${FETCHMAIL_POLL_INTERVAL:-60}
      FETCHMAIL_PARALLEL: "0"
      DMS_CONFIG_POLL: "10"
      ENABLE_RSPAMD: "1"
      ENABLE_RSPAMD_REDIS: "1"
      ENABLE_CLAMAV: "1"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_POSTGREY: "0"
      RSPAMD_GREYLISTING: "0"
      SPAM_SUBJECT: "[SPAM] "
      ENABLE_IMAP: "0"
      ENABLE_POP3: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_QUOTAS: "0"
      ONE_DIR: "1"
      PERMIT_DOCKER: connected-networks
      POSTFIX_INET_PROTOCOLS: ipv4
      DEFAULT_RELAY_HOST: "[${EXCHANGE_HOST}]:${EXCHANGE_PORT:-25}"
    volumes:
      - ${DATA_PATH:-/volume1/docker/MailGate}/config:/tmp/docker-mailserver
      - ${DATA_PATH:-/volume1/docker/MailGate}/mail-data:/var/mail
      - ${DATA_PATH:-/volume1/docker/MailGate}/mail-state:/var/mail-state
    networks:
      - mailgate
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -P 'LISTEN.+:smtp' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m

  avupdater:
    build:
      context: ./av-updater
    container_name: mailgate-avupdater
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Brussels}
      CONTROL_DIR: /control
      CLAMAV_STATE_ROOT: /var/mail-state
      CLAMAV_UID: "100"
      CLAMAV_GID: "101"
    volumes:
      - ${DATA_PATH:-/volume1/docker/MailGate}/config/av-update:/control
      - ${DATA_PATH:-/volume1/docker/MailGate}/mail-state:/var/mail-state
    networks:
      - mailgate

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    container_name: mailgate-dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      EVENTS: "0"
      PING: "1"
      VERSION: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mailgate
    read_only: true
    tmpfs:
      - /run
      - /tmp

  ui:
    build:
      context: ./ui
    container_name: mailgate-ui
    user: "${PUID:-1026}:${PGID:-100}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Brussels}
      MAILGATE_VERSION: ${MAILGATE_VERSION:-0.2.6}
      MAILGATE_BUILD: ${MAILGATE_BUILD:-20260804.11}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-change-me-now}
      EXCHANGE_HOST: ${EXCHANGE_HOST}
      EXCHANGE_PORT: ${EXCHANGE_PORT:-25}
      FETCHMAIL_POLL_INTERVAL: ${FETCHMAIL_POLL_INTERVAL:-60}
      CONFIG_PATH: /data/config
      CLAMAV_STATE_PATH: /data/mail-state
      AV_UPDATE_CONTROL_PATH: /data/config/av-update
      DOCKER_API_URL: http://dockerproxy:2375
      MAILSERVER_CONTAINER: mailgate-mailserver
    volumes:
      - ${DATA_PATH:-/volume1/docker/MailGate}/config:/data/config
      - ${DATA_PATH:-/volume1/docker/MailGate}/mail-state:/data/mail-state:ro
    ports:
      - ${WEB_PORT:-8795}:8080
    networks:
      - mailgate
    depends_on:
      - mailserver
      - avupdater
      - dockerproxy

networks:
  mailgate:
    driver: bridge
